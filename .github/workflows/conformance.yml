name: Conformance Check

# Runs on every push (assignment Section 5, "Continuous conformance
# checking"): interface conformance tests plus a full harness pass over
# the public toy/dev query set, so interface breakage is caught within
# minutes of pushing, not at the deadline.
#
# This does NOT compute your leaderboard score -- Track A/B/C numbers
# here are against the toy set (or the released dev set, if you point
# CORPUS_DIR at data/full), not the private held-out set + undisclosed
# noise recipe used for grading.

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests, including relevance-model regressions
        run: python -m pytest tests/ -v

      - name: Full harness smoke run (toy set)
        run: |
          python -m harness.run_harness \
            --corpus data/toy/corpus.jsonl \
            --queries data/toy/queries_dev.tsv \
            --qrels data/toy/qrels_dev.txt \
            --candidates data/toy/candidates_dev.jsonl \
            --run-out runs/dev_run.trec \
            --report-out runs/dev_report.json

      - name: Upload run + report
        uses: actions/upload-artifact@v4
        with:
          name: dev-run-and-report
          path: runs/
